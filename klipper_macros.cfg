###########################
# GUARDAR ALTURA PUNTUAL
###########################
[gcode_macro _PLR_Z]
description: "Guarda la posición Z actual en el archivo de variables persistentes"
gcode:
    # Captura el parámetro Z enviado (normalmente desde el G-code de la pieza)
    {% set z = params.Z|float %}
    # Obtiene la posición actual del cabezal según Klipper
    {% set pos = printer.gcode_move.gcode_position %}

    # SAVE_VARIABLE escribe en variables.cfg. Esto sobrevive a un apagón total.
    SAVE_VARIABLE VARIABLE=plr_z VALUE={z}

###########################
# INICIO DE IMPRESIÓN CON PLR
###########################
[gcode_macro _PLR_PRINT_START]
description: "Inicializa las variables de recuperación al empezar una pieza"
gcode:
    # Obtiene el nombre del archivo que se está imprimiendo actualmente
    {% set filename = printer.print_stats.filename %}
    
    {% if filename == "" %}       
        # Si por algún motivo no hay archivo activo, lanza un error en consola
        {action_respond_info("ERROR: no hay fichero activo en impresión")}
    {% else %}
        # Guarda el nombre del archivo para saber cuál retomar tras el reinicio
        SAVE_VARIABLE VARIABLE=plr_file VALUE='"{filename}"'
        # Activa el "flag" o interruptor de PLR para indicar que hay una impresión en curso
        SAVE_VARIABLE VARIABLE=plr_activate VALUE=True

        UPDATE_DELAYED_GCODE ID=PLR_TICKER DURATION=2
        
    {% endif %}
    
###########################
# DETENER PLR COMPLETAMENTE
###########################

[gcode_macro _PLR_STOP]
description: "Limpia y desactiva el sistema PLR (se llama al finalizar con éxito)"
gcode:
    # Desactiva el interruptor para que no salte el aviso de recuperación al reiniciar
    SAVE_VARIABLE VARIABLE=plr_activate VALUE=False

    SAVE_VARIABLE VARIABLE=plr_z VALUE='""'
    SAVE_VARIABLE VARIABLE=plr_file VALUE='""'
    SAVE_VARIABLE VARIABLE=plr_file_pos VALUE=0
    
    UPDATE_DELAYED_GCODE ID=PLR_TICKER DURATION=0
    
###########################
# PAUSA CON GUARDADO DE POSICIÓN
###########################
[gcode_macro _PLR_PAUSE]
description: "Guarda la Z exacta en el momento de una pausa"
gcode:
    # Captura la posición Z actual del cabezal
    {% set pos = printer.gcode_move.gcode_position %}
    # La guarda de forma persistente
    SAVE_VARIABLE VARIABLE=plr_z VALUE={pos.z}
    
###########################
# REANUDAR AUTO-GUARDADO
###########################
[gcode_macro _PLR_RESUME]
description: "Espacio reservado para lógica adicional al reanudar"
gcode:
    # Actualmente vacío, sirve como punto de anclaje para futuras mejoras

###########################
# COMPROBAR FALLO AL INICIAR
###########################
[gcode_macro _PLR_CHECK]
description: "Revisa al arrancar la impresora si quedó una impresión a medias"
gcode:
    # Consulta si la variable 'plr_activate' es True en variables.cfg
    {% if printer.save_variables.variables.plr_activate %}
        # Si es True, lanza la alerta visual de recuperación
        _PLR_FAILURE_ALERT
    {% endif %}
    
[gcode_macro _PLR_FAILURE_ALERT]
description: "Muestra el menú interactivo de recuperación en la pantalla y Telegram"
gcode:
    RESPOND TYPE=command MSG="action:prompt_end" # Limpia avisos previos
    RESPOND TYPE=command MSG="action:prompt_begin ⚠️ Se interrumpió la impresión."
    RESPOND TYPE=command MSG="action:prompt_text Se ha detectado una interrupción inesperada." 
    RESPOND TYPE=command MSG="action:prompt_text ¿Deseas retomar la impresión desde la última capa guardada?" 
    
    # Botón de acción principal
    RESPOND TYPE=command MSG="action:prompt_footer_button CONTINUAR|_PLR_RECOVERY|primary" 
    # Botón de descarte en rojo
    RESPOND TYPE=command MSG="action:prompt_footer_button CANCELAR IMPRESION|_PLR_CANCEL_PRINT_RECOVERY|error" 
    RESPOND TYPE=command MSG="action:prompt_show" 
    
    RESPOND PREFIX=tgalarm_photo MSG="⚠️ ¡FALLO DETECTADO! Se interrumpió la impresión. Usa /_PLR_RECOVERY para retomar."

###########################
# CANCELAR RECUPERACIÓN
###########################
[gcode_macro _PLR_CANCEL_PRINT_RECOVERY]
description: "Acción cuando el usuario decide NO recuperar la impresión"
gcode:
    _PLR_STOP                     # Limpia variables
    RESPOND TYPE=command MSG="action:prompt_end"    # Cierra aviso

###########################
# INICIAR IMPRESIÓN DE RECUPERACIÓN
###########################
[gcode_macro _PLR_AUTO_PRINT_RECOVERY]
description: "Macro técnica que prepara los ejes y arranca el archivo modificado"
gcode:
    {% set file = params.FILE|default("") %}
    # Lee la Z donde ocurrió el fallo
    
    {% set z_hop_config = printer.configfile.settings['safe_z_home'].z_hop | float %}

    # Define una Z de seguridad 10mm por encima de la pieza
    {% set z_corr = "%.3f"|format(z_base + z_hop_config) %}
    
    {% if file == "" %}
        {action_respond_info("ERROR: no se ha especificado FILE")}
    {% else %}
        {action_respond_info("Iniciando impresión de recuperación")}
        
        # IMPORTANTE: Solo hace Home en X e Y para no chocar con la pieza que ya está en la cama
        G28 X Y
        
        # Engaña a la impresora: le dice que la Z actual es z_base + 10 sin moverse físicamente
        # Esto evita que el cabezal baje y aplaste la pieza al intentar hacer Home Z
        SET_KINEMATIC_POSITION Z={z_corr}

        # Se aparta a una zona segura
        G1 X250 F3000

        # M23: Carga el archivo G-code ya procesado
        M23 {file}          
        # M24: Inicia la ejecución del archivo
        M24                  
        
        # Actualiza el nombre del archivo en el sistema PLR
        SAVE_VARIABLE VARIABLE=plr_file VALUE='"{file}"'
    {% endif %}

###########################
# PROCESAR RECUPERACIÓN (SCRIPT)
###########################
[gcode_macro _PLR_RECOVERY]
description: "Llama al script de Linux para 'limpiar' el G-code hasta la altura Z del fallo"
gcode:
    {% set z = printer.save_variables.variables.plr_z|float %}
    {% set file_pos = printer.save_variables.plr_file_pos|int %}
        
    # Si PLR está activado, ejecuta un comando de sistema (Shell)
    # Este script externo leerá el archivo original y borrará todo el G-code previo a la altura 'z'
    {% if printer.save_variables.variables.plr_activate %}
        RUN_SHELL_COMMAND CMD=PLR_RESUME PARAMS="\"{printer.save_variables.variables.plr_file}\" {file_pos} {z}"
    {% endif %}
    
[gcode_macro _PLR_AFTER_RECOVERY_ACTIONS]
gcode:
  PURGE_NOZZLE PUSH=5 SPEED_PUSH=300
  G4 P1000
  CLEAN_NOZZLE

[delayed_gcode PLR_TICKER]
gcode:
    {% if printer.print_stats.state == "printing" %}
        {% set pos = printer.virtual_sdcard.file_position %}
        SAVE_VARIABLE VARIABLE=plr_file_pos VALUE={pos}
    {% endif %}
    UPDATE_DELAYED_GCODE ID=PLR_TICKER DURATION=2
